# Overlay de despliegue REAL sobre VPS B (2.24.8.109), reutilizando el Traefik ya existente en
# `/opt/traefik` (red `proxy`, resolutor `letsencrypt` ya funcionando para autoken.es). No sustituye
# a `docker-compose.yml` (que sigue sirviendo para dev/CI local, sin Traefik): se usa AÑADIDO,
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`.
#
# Dominio de este despliegue: variable `PUBLIC_HOST` (por defecto `panel-staging.autoken.es`, el
# subdominio de staging ya creado en el DNS desde la tarea 0.2) — cambiar vía `.env`/`--env-file`
# si se despliega otro entorno (p. ej. producción real, D.1) sin tocar este fichero.

services:
  worker:
    environment:
      DEPLOYMENT_PROFILE: proxy

  api:
    environment:
      DEPLOYMENT_PROFILE: proxy
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      # Con `api` en dos redes (`default` para hablar con postgres/redis/minio, `proxy` para
      # Traefik), hay que decirle a Traefik cuál usar — sin esto, elige una red arbitraria (aquí,
      # `default`, donde Traefik no tiene ninguna pata) y da 504 aunque la conexión directa a la IP
      # de `proxy` funcione (fallo real encontrado al desplegar, verificado con `docker exec traefik
      # wget` contra la IP de cada red).
      - "traefik.docker.network=proxy"
      # `/api` tiene prioridad sobre el frontend estático (mismo host) — mismo patrón que
      # `/opt/autoken/docker-compose.yml` (autoken-api vs autoken-web), ya probado en producción.
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-api.rule=Host(`${PUBLIC_HOST:-panel-staging.autoken.es}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-api.priority=100"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-api.entrypoints=websecure"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-api.service=${PUBLIC_HOST_SLUG:-panel-staging}-api"
      - "traefik.http.services.${PUBLIC_HOST_SLUG:-panel-staging}-api.loadbalancer.server.port=8000"
      # `ilex.autoken.es`: subdominio de tenant DEMO (vacío a propósito, sin datos reales), y
      # `setex.autoken.es`: tenant REAL (Setex, empresas/facturas reales) — corrección 2026-07-27,
      # antes se habían cargado los datos reales de Setex en `ilex` por error. Ambos ya reservados
      # en el DNS desde la tarea 0.2, apuntados a la MISMA api/frontend de este despliegue (un
      # tenant real con ese slug resuelve normal — solo es un Host más de Traefik, no un despliegue
      # aparte). Dominios propios de CLIENTE arbitrarios (uno que no se conozca de antemano) siguen
      # siendo un problema aparte, ver docs/runbooks/despliegue-vps-b.md. `.service=` explícito en
      # todas las rutas nuevas: con dos routers en el mismo contenedor, Traefik no puede enlazar el
      # servicio automáticamente ("cannot be linked automatically with multiple Services", fallo
      # real visto al desplegar).
      - "traefik.http.routers.ilex-api.rule=Host(`ilex.autoken.es`) && PathPrefix(`/api`)"
      - "traefik.http.routers.ilex-api.priority=100"
      - "traefik.http.routers.ilex-api.entrypoints=websecure"
      - "traefik.http.routers.ilex-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ilex-api.service=ilex-api"
      - "traefik.http.services.ilex-api.loadbalancer.server.port=8000"
      # `setex.autoken.es`: tenant real (Setex), datos reales de empresas/facturas — mismo patrón
      # que `ilex-api` de arriba.
      - "traefik.http.routers.setex-api.rule=Host(`setex.autoken.es`) && PathPrefix(`/api`)"
      - "traefik.http.routers.setex-api.priority=100"
      - "traefik.http.routers.setex-api.entrypoints=websecure"
      - "traefik.http.routers.setex-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.setex-api.service=setex-api"
      - "traefik.http.services.setex-api.loadbalancer.server.port=8000"

  # Frontend estático (SPA React/Vite, build de producción servido por nginx) — mismo dominio que
  # la API (`baseUrl` del cliente OpenAPI ya es relativo, sin CORS de por medio), el router de
  # arriba (`-api`, prioridad 100) intercepta `/api` antes de llegar aquí.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: autoken/frontend:dev
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-web.rule=Host(`${PUBLIC_HOST:-panel-staging.autoken.es}`)"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-web.entrypoints=websecure"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-web.service=${PUBLIC_HOST_SLUG:-panel-staging}-web"
      - "traefik.http.services.${PUBLIC_HOST_SLUG:-panel-staging}-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${PUBLIC_HOST_SLUG:-panel-staging}-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${PUBLIC_HOST_SLUG:-panel-staging}-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${PUBLIC_HOST_SLUG:-panel-staging}-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${PUBLIC_HOST_SLUG:-panel-staging}-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.${PUBLIC_HOST_SLUG:-panel-staging}-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.routers.${PUBLIC_HOST_SLUG:-panel-staging}-web.middlewares=${PUBLIC_HOST_SLUG:-panel-staging}-sec"
      # `ilex.autoken.es` (mismo motivo que el router `ilex-api` de arriba: `.service=` explícito).
      - "traefik.http.routers.ilex-web.rule=Host(`ilex.autoken.es`)"
      - "traefik.http.routers.ilex-web.entrypoints=websecure"
      - "traefik.http.routers.ilex-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ilex-web.service=ilex-web"
      - "traefik.http.services.ilex-web.loadbalancer.server.port=80"
      - "traefik.http.routers.ilex-web.middlewares=${PUBLIC_HOST_SLUG:-panel-staging}-sec"
      # `setex.autoken.es` (mismo motivo que `ilex-web`: `.service=` explícito).
      - "traefik.http.routers.setex-web.rule=Host(`setex.autoken.es`)"
      - "traefik.http.routers.setex-web.entrypoints=websecure"
      - "traefik.http.routers.setex-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.setex-web.service=setex-web"
      - "traefik.http.services.setex-web.loadbalancer.server.port=80"
      - "traefik.http.routers.setex-web.middlewares=${PUBLIC_HOST_SLUG:-panel-staging}-sec"
    restart: unless-stopped

networks:
  proxy:
    external: true
