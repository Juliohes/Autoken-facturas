# Docker Compose — Autoken Facturas v2
# api + worker + postgres + redis + minio + clamav + prometheus + grafana + alertmanager +
# node-exporter (S5.6, observabilidad). El resto de servicios (caddy) se añaden en sprints
# posteriores. Los secretos se inyectan vía .env (no versionado). Ver ../.env.example.
#
# El stack de observabilidad (prometheus/grafana/alertmanager/node-exporter) está completo y
# versionado, pero desplegarlo de verdad contra la VPS B y verificar que las alertas disparan con
# tráfico real queda pendiente de una sesión futura con acceso a esa infraestructura (spec S5.6 §6,
# mismo patrón que el Caddy/TLS real de S4.6).

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: autoken/api:dev
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://autoken_app:${POSTGRES_APP_PASSWORD:-autoken}@postgres:5432/${POSTGRES_DB:-autoken}
      REDIS_URL: redis://redis:6379/0
      # Object storage MinIO (intake S2.1): bucket por tenant. Credenciales por .env en staging/prod.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # Antivirus fail-closed (intake S2.1): en el contenedor se usa ClamAV real vía el daemon clamd.
      VIRUS_SCANNER_BACKEND: ${VIRUS_SCANNER_BACKEND:-clamd}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # IP real del cliente tras el proxy inverso (rate-limit por IP, B1/C22). Deben ir alineados:
      # `TRUSTED_PROXIES` (lo usa la app para aceptar `X-Forwarded-For`) y `FORWARDED_ALLOW_IPS` (lo
      # usa uvicorn con `--proxy-headers`). Vacío por defecto = no se confía en XFF (IP = peer).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Captura de errores (S5.6): sin DSN, `init_sentry` no hace nada (coste cero hasta que Julio
      # cree la cuenta y lo rellene en el .env real).
      SENTRY_DSN: ${SENTRY_DSN:-}
    # Solo loopback: el acceso real pasa por el proxy inverso (Traefik, docker-compose.prod.yml en
    # despliegues reales); publicar 8000 en todas las interfaces lo dejaría alcanzable saltándose
    # las cabeceras/TLS/rate-limit del borde (defensa en profundidad, aunque el firewall del VPS ya
    # solo permite 22/80/443).
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped

  # Worker OCR S2.3 (jobs, arq): misma imagen del backend, arranca el consumidor de la cola en vez de
  # uvicorn. Comparte Postgres/Redis/MinIO con la API. Encola la API (best-effort) tras cada subida y
  # el worker procesa `run_ocr` (extracción gemini-3-flash + validaciones + estado). Las credenciales
  # de Vertex/Gemini y del resto de servicios llegan por .env (no versionado).
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: autoken/api:dev
    command: ["arq", "jobs.worker.WorkerSettings"]
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://autoken_app:${POSTGRES_APP_PASSWORD:-autoken}@postgres:5432/${POSTGRES_DB:-autoken}
      REDIS_URL: redis://redis:6379/0
      OCR_QUEUE_NAME: ${OCR_QUEUE_NAME:-autoken:queue:ocr}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # Vertex/Gemini: el worker es el ÚNICO proceso que llama al motor real (gemini-3-flash) en
      # staging/prod. Sin estas variables + el SA montado, cada fichero caería a `ocr_failed`. El
      # proyecto y la región no son secretos; el JSON de la service account SÍ (montado read-only).
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GEMINI_LOCATION: ${GEMINI_LOCATION:-global}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-3-flash-preview}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-sa.json
    volumes:
      # Service account de Vertex (secreto, NO versionado): vive en `secrets/vertex-sa.json` del VPS.
      - ../secrets/vertex-sa.json:/run/secrets/vertex-sa.json:ro
    # La imagen `autoken/api:dev` trae un HEALTHCHECK horneado que hace `curl localhost:8000/health`
    # (pensado para `api`, que sirve HTTP); `worker` arranca `arq` en su lugar, que nunca escucha ese
    # puerto — ese chequeo llevaba meses marcando el contenedor "unhealthy" de forma permanente
    # (encontrado el 03/08/2026 investigando un fallo real de subida de fotos, sin relación con esto:
    # el worker en sí funcionaba bien). Se sustituye por un ping a Redis (la dependencia real del
    # worker), en vez de desactivarlo sin más.
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # `POSTGRES_USER` es el SUPERUSUARIO de arranque del clúster (`postgres` por defecto), nunca
  # `autoken_app`: si coincidieran de nombre, la migración 0001 (`CREATE ROLE autoken_app ... IF NOT
  # EXISTS`) se saltaría por completo (el rol "ya existiría", como superusuario) y el guard de
  # arranque de la app (`assert_runtime_role_cannot_bypass_rls`, ADR-0014) abortaría siempre — fallo
  # real encontrado al desplegar de verdad (S5.3/S5.6). El rol runtime `autoken_app` (restringido,
  # NOLOGIN de fábrica) lo crea la propia migración 0001; ver el servicio `provision-app-role` más
  # abajo para concederle LOGIN + contraseña tras aplicar migraciones.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-autoken}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-autoken}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Object storage S3-compatible (intake S2.1, ADR-0015): un bucket por tenant (`tenant-<id>`) como
  # frontera de aislamiento. Las credenciales root se inyectan por .env en staging/producción.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Antivirus (intake S2.1, ADR-0015): daemon ClamAV que escucha en 3310 (fail-closed: si no
  # responde, la subida se rechaza con 503). La primera arrancada descarga la base de firmas.
  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Herramientas de despliegue (perfil `tools`, NUNCA arrancan con `docker compose up`; se invocan
  # explícitamente con `docker compose run --profile tools <servicio>`). Conectan como el
  # SUPERUSUARIO admin, nunca como `autoken_app` — la app en sí no tiene privilegios de DDL.
  #
  # `migrate`: aplica las migraciones de Alembic (crea/actualiza el esquema, incluida la propia
  # `CREATE ROLE autoken_app` de la migración 0001).
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: autoken/api:dev
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-autoken}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # `provision-app-role`: concede LOGIN + contraseña al rol runtime `autoken_app` (la migración 0001
  # lo crea a propósito SIN contraseña real embebida en el histórico de migraciones — ver su
  # docstring). Idempotente: relanzarlo tras rotar `POSTGRES_APP_PASSWORD` actualiza la contraseña.
  provision-app-role:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-postgres}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-autoken}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?define POSTGRES_APP_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "psql -v ON_ERROR_STOP=1 -c \"ALTER ROLE autoken_app WITH LOGIN PASSWORD '$$APP_PASSWORD'\""
    depends_on:
      postgres:
        condition: service_healthy

  # Observabilidad (S5.6). Scrapea la API (GET /api/v1/metrics) y node-exporter; evalúa las reglas
  # de alerts.yml y las dispara a Alertmanager. Puerto solo en loopback (127.0.0.1): ni Prometheus
  # ni Alertmanager tienen autenticación propia, así que no se publican a todas las interfaces
  # (auditoría de seguridad) — el acceso remoto real debe ir por el proxy inverso con auth, nunca
  # por el puerto crudo.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # Recibe las alertas de Prometheus y decide a quién avisar (S5.6). Receptor "null" por defecto
  # (sin canal real configurado, ver alertmanager.yml) hasta que Julio decida email/Slack. Puerto en
  # loopback por el mismo motivo que Prometheus (sin autenticación propia).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # Métricas del host (disco, CPU, memoria) para la alerta de disco bajo mínimo (S5.6). Necesita
  # acceso de solo lectura al filesystem/proc/sys REAL de la VPS: en local (dev) mide el propio
  # contenedor/host de desarrollo, sin significado operativo real hasta desplegarlo en la VPS B. Sin
  # puerto de host: solo accesible por la red interna de compose (lo scrapea Prometheus).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped

  # Visualiza las métricas de Prometheus (S5.6): datasource y dashboard provisionados por código
  # (infrastructure/grafana/), sin configuración manual en la UI. Contraseña admin OBLIGATORIA por
  # .env (sin valor por defecto, auditoría de seguridad): un despliegue que copie .env.example sin
  # rellenarla se niega a arrancar Grafana, en vez de levantar en silencio con `admin/admin`. Puerto
  # en loopback, mismo motivo que Prometheus/Alertmanager.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # El JSON del dashboard vive DENTRO de `./grafana/provisioning/dashboards/json/` (no en un
    # volumen separado montado anidado dentro de otro de solo lectura): Docker no puede crear el
    # punto de montaje de un segundo bind mount dentro de uno ya montado `:ro` si esa ruta no existe
    # ya en el contenido de origen — falla real encontrada al desplegar de verdad en la VPS
    # (S5.6/S5.3, "read-only file system" al arrancar).
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
