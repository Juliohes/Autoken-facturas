server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: cualquier ruta que no sea un fichero real cae a index.html (routing del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La shell y el service worker deben revalidarse para que una PWA instalada
    # detecte cada despliegue sin exigir borrar los datos del navegador.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Assets versionados por hash (Vite): cacheable de forma agresiva y segura.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
