server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Experimento 2026-08-01 (rama experiment/setex-user-ui-v1): a diferencia del despliegue real
    # (donde Traefik desvía /api directamente al contenedor `api`, PathPrefix + prioridad, ver
    # docker-compose.prod.yml), este contenedor de PREVIEW es autónomo y aislado — no toca ningún
    # router de Traefik real. Aquí es nginx quien reenvía /api al contenedor `api` compartido, por
    # la red interna `infrastructure_default` (mismo backend/base de datos reales de `setex`, sin
    # duplicar nada).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un fichero real cae a index.html (routing del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionados por hash (Vite): cacheable de forma agresiva y segura.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
