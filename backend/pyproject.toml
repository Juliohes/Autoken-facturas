[project]
name = "autoken-facturas-backend"
version = "0.1.0"
description = "Backend FastAPI multi-tenant de Autoken Facturas v2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "mistralai>=1.0",
    "azure-ai-documentintelligence>=1.0",
    "aiohttp>=3.10",
    "google-genai>=2.0",
    "httpx>=0.27",
    "anthropic[vertex]>=0.40",
    # Rasterizado de PDF a imagen para los motores de visión solo-imagen (issue #16).
    # pypdfium2: motor PDFium, licencia permisiva (Apache/BSD), sin binarios de sistema.
    "pypdfium2>=4",
    "pillow>=10",
    # Autenticación S1.3 (identity): hashing Argon2id, JWT HS256, TOTP y Redis (rate-limit +
    # rotación de refresh + tokens de activación).
    "argon2-cffi>=23",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "redis>=5.0",
    # Importación en bloque de la cartera de empresas desde el Excel del cliente (companies, S1.5).
    "openpyxl>=3.1",
    # Parseo de multipart/form-data para la subida del Excel (`POST /companies/import`).
    "python-multipart>=0.0.9",
    # Intake seguro de ficheros S2.1 (invoice_intake, ADR-0015): object storage MinIO (bucket por
    # tenant), sniff de MIME real por número mágico (no por Content-Type), cliente clamd (antivirus).
    "minio>=7.2",
    "filetype>=1.2",
    "clamd>=1.0",
    # Verificación del CIF de contraparte S2.8 (counterparty, ADR-0011): cliente SOAP para AEAT
    # censal (mutual-TLS) y VIES. BORME usa httpx (ya presente). Solo se ejerce en staging; en CI
    # los resolvers van doblados. zeep no publica marcador py.typed (ver override de mypy).
    "zeep>=4.2",
]

[project.optional-dependencies]
# Worker OCR S2.3 (jobs): cola de trabajos asíncronos sobre Redis (arq). Va en un extra `worker`
# (no en las deps base) a propósito: arq declara `redis<6`, pero la app funciona con redis 8 y ese
# tope solo es metadato conservador. Que arq OPERA con redis 8 no es un supuesto: lo VERIFICA el smoke
# test `tests/test_ocr_worker_wiring.py` (encola+consume un job). Manteniéndolo fuera de la base se
# evita que un `pip install .[dev]` degrade redis y rompa el tipado del resto de la app. La imagen del
# worker lo instala con `pip install --no-deps` (ver Dockerfile), conservando redis 8.
worker = ["arq>=0.26"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# El codigo de app vive en `src`/`tests` (unico scope que CI pasa por el linter/formatter). Las
# migraciones Alembic (SQL crudo verboso, cabeceras generadas) y los scripts sueltos de bench quedan
# fuera del linter, en coherencia con ese scope de CI (`ruff check/format src tests`).
extend-exclude = ["migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# pypdfium2 (rasterizado de PDF) no publica stubs ni marcador py.typed.
[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

# openpyxl (importación del Excel de empresas) no publica marcador py.typed.
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# filetype (sniff de MIME por número mágico) no publica marcador py.typed.
[[tool.mypy.overrides]]
module = "filetype.*"
ignore_missing_imports = true

# clamd (cliente del daemon ClamAV) no publica marcador py.typed.
[[tool.mypy.overrides]]
module = "clamd.*"
ignore_missing_imports = true

# arq (cola de trabajos del worker OCR) no publica marcador py.typed.
[[tool.mypy.overrides]]
module = "arq.*"
ignore_missing_imports = true

# zeep (cliente SOAP de AEAT censal y VIES, S2.8) no publica marcador py.typed. `follow_imports=skip`
# lo trata como Any (evita `no-untyped-call` en modo strict sobre `Client`/`Transport`).
[[tool.mypy.overrides]]
module = "zeep.*"
ignore_missing_imports = true
follow_imports = "skip"

# requests (transporte del cliente SOAP zeep con el certificado cliente de AEAT) no trae stubs.
[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "isolation: suite anti-cruce de tenants (gate de CI bloqueante, plan §8)",
]
