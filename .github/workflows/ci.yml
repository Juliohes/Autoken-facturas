name: CI

# Pipeline de la sección 2.5 del plan. Se ejecuta en cada PR a develop/main
# y en push a esas ramas.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint + tipos + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # El superusuario de bootstrap es `postgres`; el rol runtime restringido `autoken_app` lo
      # crea la migración (S1.1). Si el superusuario se llamara `autoken_app`, ese rol sería
      # superusuario y saltaría la RLS, invalidando los tests de aislamiento.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      # Object storage del intake (S2.1): MinIO se levanta como step con `docker run` (ver más abajo),
      # no como service container, porque la imagen oficial `minio/minio` necesita el argumento
      # `server /data` y los service containers de Actions no permiten pasar comando/argumentos.
      # ClamAV NO hace falta en CI: los tests usan el scanner de firma (EICAR en proceso) y el
      # monkeypatch del daemon caído.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Instalar arq (worker OCR, sin deps para no degradar redis)
        # El worker (S2.3) usa arq; su smoke test (tests/test_ocr_worker_wiring.py) verifica en CI la
        # compatibilidad arq/redis 8. arq declara `redis<6` (metadato conservador), así que se instala
        # con `--no-deps` para conservar redis 8; sus deps reales (click, redis) ya están por `.[dev]`.
        run: pip install --no-deps "arq>=0.26"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (formato)
        run: ruff format --check src tests
      - name: Mypy (tipos)
        run: mypy src
      - name: Guard de deriva ORM<->migración (#49)
        # Aplica las migraciones a una BD limpia y comprueba que el esquema ORM no tiene deriva
        # respecto a ellas: un modelo cambiado sin su migración (o al revés) rompe el CI. Usa
        # `compare_type`/`compare_server_default` de env.py; verificado limpio contra el head actual.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autoken_drift
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://postgres:postgres@localhost:5432/postgres")
              await conn.execute("DROP DATABASE IF EXISTS autoken_drift")
              await conn.execute("CREATE DATABASE autoken_drift")
              await conn.close()
          asyncio.run(main())
          PY
          python -m alembic upgrade head
          python -m alembic check
      - name: Levantar MinIO (object storage del intake, S2.1)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          # Espera a que el endpoint de salud responda antes de correr los tests.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then echo "minio listo"; break; fi
            if [ "$i" = "30" ]; then echo "minio no arrancó a tiempo" >&2; docker logs minio; exit 1; fi
            sleep 1
          done
      - name: Pytest
        env:
          # DSN del superusuario para que los tests creen su BD efímera y corran las migraciones.
          TEST_DATABASE_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432
          # Conexión por defecto de la app (engine perezoso); el cableado del rol runtime es de S1.2.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          # Object storage del intake (S2.1): MinIO del service container (bucket por tenant).
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_SECURE: "false"
        run: pytest -q

  tenant-isolation:
    name: gate aislamiento de tenants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # La suite anti-cruce (S1.7) corre contra Postgres real (RLS) + Redis, igual que el job backend.
      # El superusuario de bootstrap es `postgres`; el rol runtime `autoken_app` lo crea la migración
      # (si el superusuario fuera `autoken_app`, saltaría la RLS e invalidaría el gate).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Suite anti-cruce de tenants (gate bloqueante, plan §8)
        env:
          TEST_DATABASE_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
        run: pytest -m isolation -q

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar cliente OpenAPI
        run: npm run gen:api
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (vitest, componentes S2.4)
        run: npm run test
      - name: Build
        run: npm run build

  security:
    name: secretos + dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (detección de secretos)
        run: |
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (dependencias backend) — informativo
        continue-on-error: true
        run: |
          pip install pip-audit
          pip install -e ./backend
          pip-audit || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (dependencias frontend) — informativo
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high || true

  docker-build:
    name: build imagen backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen del backend (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: autoken/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
